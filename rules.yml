groups:
  # Groups: Power Alerts
  - name: power_alerts
    rules:
      - alert: UPSOnBattery
        expr: ups_in_voltage < 100
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "🔌 Brak zasilania w Piwnicy!"
          description: |
            **Status:** UPS przeszedł na baterię.
            **Wejście:** {{ $value }}V (spadek poniżej 100V).
            **Pozostały czas:** {{ with printf "ups_remaining_runtime" | query }}{{ . | first | value | humanizeDuration }}{{ end }}.
            **Obciążenie:** {{ with printf "ups_load" | query }}{{ . | first | value }}{{ end }}%.

      - alert: UPSLowBattery
        expr: ups_battery_capacity < 30
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🪫 Krytycznie mało energii w UPS!"
          description: "Poziom naładowania spadł do **{{ $value }}%**."

  # Groups: Service Status
  - name: services_status
    rules:
      - alert: ContainerDown
        expr: container_state_status{container_label_com_docker_compose_service!="", status="running"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "🚨 Kontener {{ $labels.container_label_com_docker_compose_service }} padł!"
          description: "Serwis `{{ $labels.container_label_com_docker_compose_service }}` przestał działać (status nie jest 'running')."

      # Sprawdzanie czy same eksportery odpowiadają (metryka UP)
      - alert: ExporterDown
        expr: up{job=~"node-exporter|pwrstat-exporter|cadvisor|alertmanager|backup-mayster"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🚨 Eksporter {{ $labels.job }} nie działa!"
          description: "Prometheus stracił połączenie z usługą {{ $labels.job }}."

  # Groups: Storage Capacity
  - name: storage_capacity
    rules:
      - alert: HostDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|vfat|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|vfat|overlay"}) * 100 < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "🚨 KRYTYCZNIE mało miejsca: {{ $labels.mountpoint }}"
          description: "Na dysku **{{ $labels.mountpoint }}** zostało tylko {{ printf \"%.2f\" $value }}% wolnego miejsca!"

  # Groups: Host Resource Usage
  - name: host_resources
    rules:
      - alert: HostHighCpuLoad
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "🔥 Wysokie obciążenie CPU"
          description: "Obciążenie procesora na host {{ $labels.instance }} przekracza 90%."

  # Groups: Network Performance
  - name: network_performance
    rules:
      - alert: InternetDownloadSpeedLow
        expr: speedtest_download_bits_per_second < 500000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "🌐 Słaby Download"
          description: "Prędkość spadła do {{ $value | humanize1024 }}bps."

      - alert: SpeedtestExporterDown
        expr: up{job="speedtest-exporter"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "🚨 Speedtest Exporter nieosiągalny"
          description: "Prometheus nie może pobrać metryk ze speedtestu."

  # Groups: Disk SMART & Temp
  - name: disk_alerts
    rules:
      - alert: DiskSmartStatusBad
        expr: smartctl_device_status == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "🚨 Awaria SMART na {{ $labels.device }}!"
          description: "Dysk {{ $labels.device }} na hoście {{ $labels.instance }} zgłasza błąd statusu SMART!"

      - alert: DiskTemperatureHigh
        expr: smartctl_device_temperature > 55
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "🔥 Przegrzany dysk: {{ $labels.device }}"
          description: "Temperatura dysku {{ $labels.device }} przekroczyła 55°C (aktualnie: {{ $value }}°C)."

  # Groups: Backup Alerts
  - name: backup_alerts
    rules:
      # Alert jeśli ogólny status backupu raportuje błąd
      - alert: BackupFailed
        expr: backup_mayster_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "🚨 Backup Mayster: Główny proces backupu zgłosił błąd!"
          description: "Ostatnie uruchomienie skryptu backup-mayster zakończyło się niepowodzeniem."

      # Alert dla konkretnej aplikacji (pokaże jej nazwę w powiadomieniu)
      - alert: BackupAppFailed
        expr: backup_mayster_app_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "🚨 Backup Mayster: Błąd backupu aplikacji {{ $labels.app }}!"
          description: "Kopia zapasowa dla aplikacji `{{ $labels.app }}` nie udała się podczas ostatniego uruchomienia."

      # Alert "Dead Man's Switch" - jeśli backup nie uruchomił się przez ostatnie 10 godzin
      - alert: BackupNoRun
        expr: (time() - backup_mayster_last_run_timestamp_seconds) > 36000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "🚨 Backup Mayster: Brak świeżego backupu!"
          description: "Skrypt backupu nie uruchomił się przez ostatnie 10 godzin (ostatni run był {{ $value | humanizeDuration }} temu)."
